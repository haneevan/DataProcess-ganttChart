<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>作業日報管理システム</title>
  <link rel="stylesheet" href="style.css">
  <script src="plotly.min.js"></script>
  <script src="main.js"></script>
</head>
<body>

<div class="navbar">
  <button class="nav-btn" id="btn-back" onclick="goBack()" disabled>← 戻る</button>
  <h1>作業日報管理システム</h1>
  <span class="breadcrumb" id="breadcrumb">ホーム</span>
  <div style="display: flex; gap: 8px; align-items: center;">
    <button class="nav-btn" id="btn-settings" onclick="showSettings()">⚙️ 設定</button>
    <button class="nav-btn" id="btn-fwd" onclick="goSummary()" disabled>まとめ →</button>
  </div>
</div>

<!-- Home Screen -->
<div class="screen active" id="screen-home">
  <div class="home-wrap">
    <div class="home-card">
      <h2>📋 データ選択</h2>
      <div class="field-group">
        <label>日付</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field-group">
        <label>作業者名</label>
        <select id="opSelect">
          <option value="">-- 読み込み中... --</option>
        </select>
      </div>
      <button class="btn-primary" onclick="showGantt()">ガントチャートを表示 →</button>
      <p class="home-hint">data/ フォルダ内の CSV ファイルから自動検出</p>
    </div>

    <div class="op-panel">
      <h3>
        <span>👤 作業者一覧</span>
        <span id="op-count" style="font-size:12px; color:#888; font-weight:normal;"></span>
      </h3>
      <input type="text" id="opSearchInput" class="op-search" placeholder="作業者名で検索..." oninput="filterOperatorDirectory()">
      <div class="op-list" id="opDirectoryList">
        <div style="padding:16px; color:#999; font-size:13px; text-align:center;">読み込み中...</div>
      </div>
    </div>
  </div>
</div>

<!-- Gantt Chart Screen -->
<div class="screen" id="screen-gantt">
  <div id="gantt-wrapper">
    <div style="padding:40px;color:#999;font-size:15px;">⏳ 読み込み中...</div>
  </div>
</div>

<!-- Summary Screen Dashboard Layout -->
<div class="screen" id="screen-summary">
  <div class="sum-dash-container">
    
    <!-- Top Operator Selector Header -->
    <div class="sum-dash-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h2 style="margin:0; font-size: 20px; color: #1e88e5; font-weight: bold;">作業まとめ</h2>
        <select id="summaryOpSelect" class="op-dropdown-pill" onchange="onSummaryOperatorChange()">
          <option value="">-- 作業者を選択 --</option>
        </select>
      </div>
    </div>

    <!-- Main Split Section (Left: Controls & Table, Right: Plotly Chart) -->
    <div class="sum-dash-content">
      
      <!-- LEFT PANEL: Filters & Table -->
      <div class="sum-left-card">
        <div class="sum-toolbar">
          <div class="date-range-group">
            <input type="date" id="sumStartDate" class="date-pill">
            <span>～</span>
            <input type="date" id="sumEndDate" class="date-pill">
          </div>
          <button class="btn-action btn-blue" onclick="loadSummaryData()">データ読込</button>
          <div style="display: flex; gap: 6px; margin-left: auto;">
            <button class="btn-action btn-outline" onclick="refreshLatestSummaryData()" title="最新に更新">↻最新</button>
            <button class="btn-action btn-green" onclick="exportSummaryCSV()" title="CSV出力">出力</button>
          </div>
        </div>

        <div class="sum-table-wrapper" onclick="closeFilterPopoverOnClickOutside(event)">
          <table class="sum-detail-table">
            <thead>
              <tr>
                <th style="width: 15%;">日付</th>
                <th style="width: 20%;">
                  <div class="th-filter-wrap">
                    <span>設備</span>
                    <button class="btn-th-filter" id="btn-filter-equipment" onclick="toggleFilterPopover('equipment', event)" title="フィルター">▼</button>
                  </div>
                </th>
                <th style="width: 22%;">
                  <div class="th-filter-wrap">
                    <span>内容</span>
                    <button class="btn-th-filter" id="btn-filter-content" onclick="toggleFilterPopover('content', event)" title="フィルター">▼</button>
                  </div>
                </th>
                <th style="width: 16%;">開始時刻</th>
                <th style="width: 16%;">終了時刻</th>
                <th style="width: 11%;">合計(分)</th>
              </tr>
            </thead>
            <tbody id="sum-detail-tbody">
              <tr>
                <td colspan="6" style="text-align: center; color: #999; padding: 30px;">
                  「データ読込」をクリックしてデータを表示してください。
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT PANEL: Bar Chart -->
      <div class="sum-right-card">
        <div id="sum-barchart-container" style="width: 100%; height: 100%; min-height: 500px;">
          <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#aaa; font-size:14px;">
            チャート読み込み中...
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Floating Excel-like Filter Popover Window -->
<div id="filter-popover" class="filter-popover" style="display: none;">
  <div class="popover-search-box">
    <input type="text" id="filter-search-input" placeholder="検索..." oninput="filterPopoverOptions()">
  </div>
  <div class="popover-select-all-row">
    <label><input type="checkbox" id="filter-select-all-cb" onchange="toggleFilterSelectAll(this.checked)"> (すべて選択)</label>
  </div>
  <div class="popover-list" id="filter-options-list">
    <!-- Checkbox options injected dynamically -->
  </div>
  <div class="popover-actions">
    <button class="btn-popover btn-popover-cancel" onclick="closeFilterPopover()">キャンセル</button>
    <button class="btn-popover btn-popover-ok" onclick="applyFilterFromPopover()">OK</button>
  </div>
</div>

<!-- Settings Screen -->
<div class="screen" id="screen-settings">
  <div class="sum-wrap" style="max-width: 800px; margin: 0 auto;">
    <div class="sum-header">
      <h2>⚙️ 項目設定</h2>
      <p style="color: gray; font-size: 13px; margin-top: 4px;">
        ※ AndroidアプリのCSVから未登録の項目を検出すると、自動的に「灰色」でここに登録されます。
      </p>
    </div>
    
    <div class="sum-panel" style="margin-top: 15px;">
      <table class="act-table" id="activities-table">
        <thead>
          <tr>
            <th style="text-align: left; padding-left: 15px;">業務項目名</th>
            <th style="text-align: center; width: 150px;">表示カラー </th>
            <th style="text-align: center; width: 100px;">操作</th>
          </tr>
        </thead>
        <tbody id="activities-list-body">
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
